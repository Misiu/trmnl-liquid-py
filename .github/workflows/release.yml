name: Release

on:
  push:
    tags:
      - "*.*.*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  build:
    name: Validate tag and build distributions
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Verify tag matches package version
        id: version
        shell: bash
        run: |
          VERSION="$(python - <<'PY'
          import runpy

          print(runpy.run_path("src/trmnl_liquid/__about__.py")["__version__"])
          PY
          )"
          if [[ "$GITHUB_REF_NAME" != "$VERSION" ]]; then
            echo "Release tag '$GITHUB_REF_NAME' does not match __version__ '$VERSION'." >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify tagged commit belongs to main
        shell: bash
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            echo "Tag '$GITHUB_REF_NAME' does not point to a commit on main." >&2
            exit 1
          fi

      - name: Verify green main CI for tagged commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for workflow in ci.yml compatibility.yml; do
            CONCLUSION="$(
              gh api \
                -H "Accept: application/vnd.github+json" \
                "/repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs?head_sha=$GITHUB_SHA&event=push&status=completed&per_page=20" \
                --jq '.workflow_runs[0].conclusion // ""'
            )"
            if [[ "$CONCLUSION" != "success" ]]; then
              echo "Workflow '$workflow' has no successful completed push run for $GITHUB_SHA." >&2
              echo "Wait for main CI to finish successfully, then re-run this Release workflow." >&2
              exit 1
            fi
          done

      - name: Build distributions
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*

      - name: Verify built version
        shell: bash
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.version }}
        run: |
          python - <<'PY'
          import email
          import os
          import zipfile
          from pathlib import Path

          expected = os.environ["EXPECTED_VERSION"]
          wheel = next(Path("dist").glob("*.whl"))
          with zipfile.ZipFile(wheel) as archive:
              metadata_name = next(
                  name for name in archive.namelist() if name.endswith(".dist-info/METADATA")
              )
              metadata = email.message_from_bytes(archive.read(metadata_name))
          actual = metadata["Version"]
          if actual != expected:
              raise SystemExit(
                  f"Built package version {actual!r} does not match tag {expected!r}."
              )
          PY

      - uses: actions/upload-artifact@v6
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/trmnl-liquid-py/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: python-package-distributions
          path: dist/

      - uses: pypa/gh-action-pypi-publish@v1.14.2

  github-release:
    name: Create GitHub Release
    needs: [build, publish-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: python-package-distributions
          path: dist/

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          dist/*
          --repo "$GITHUB_REPOSITORY"
          --verify-tag
          --title "$GITHUB_REF_NAME"
          --generate-notes
