[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "trmnl-liquid-py"
version = "0.0.0"
description = "Python port of TRMNL Liquid with differential compatibility testing"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Tomasz Jagusz" }]
keywords = ["trmnl", "liquid", "templates", "home-assistant"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = [
  "mistune==3.3.4",
  "python-dateutil==2.9.0.post0",
  "python-liquid==2.3.1",
  "qrcode==8.2",
]

[project.urls]
Homepage = "https://github.com/Misiu/trmnl-liquid-py"
Repository = "https://github.com/Misiu/trmnl-liquid-py"
Issues = "https://github.com/Misiu/trmnl-liquid-py/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/trmnl_liquid"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-config --strict-markers"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["trmnl_liquid"]

[dependency-groups]
dev = [
  "build>=1.3",
  "mypy>=1.17",
  "pytest>=8.4",
  "ruff>=0.12",
  "twine>=6.1",
  "types-python-dateutil==2.9.0.20260807",
  "types-qrcode==8.2.0.20260518",
]
